seed: 42
dataset: stanfordnlp/imdb
validation_fraction: 0.1
output_dir: artifacts
max_features: 50000
ngram_max: 2
lstm:
  max_length: 256
  vocab_size: 30000
  embedding_dim: 100
  hidden_dim: 128
  batch_size: 64
  epochs: 5
  learning_rate: 0.001
  pretrained_vectors: null  # optional path to GloVe-format .txt vectors
transformer:
  name: distilbert-base-uncased
  max_length: 256
  batch_size: 16
  epochs: 2
  learning_rate: 0.00002