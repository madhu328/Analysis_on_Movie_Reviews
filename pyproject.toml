[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imdb-sentiment-course-project"
version = "0.1.0"
description = "Comparative IMDb sentiment classification with TF-IDF, BiLSTM and DistilBERT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "scikit-learn>=1.3,<2", "datasets>=2.18,<4", "matplotlib>=3.7,<4", "seaborn>=0.13,<1", "joblib>=1.3,<2", "beautifulsoup4>=4.12,<5", "PyYAML>=6,<7", "tqdm>=4.66,<5"]

[project.optional-dependencies]
deep = ["torch>=2.1,<3", "transformers>=4.40,<5", "accelerate>=0.28,<2", "safetensors>=0.4,<1"]
demo = ["streamlit>=1.33,<2"]
test = ["pytest>=7.4,<10"]

[project.scripts]
imdb-sentiment = "movie_sentiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]